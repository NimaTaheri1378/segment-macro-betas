project:
  local_root_env: "SMB_LOCAL_PROJECT_ROOT"
  amarel_root_env: "SMB_PROJECT_ROOT"
  required_slurm_job_id_env: "SMB_SLURM_JOB_ID"

sample:
  development_start: "2006-01-01"
  development_end: "2025-12-31"
  holdout_start: "2026-01-01"
  smoke_year: 2019
  smoke_max_firms: 40
  smoke_max_segment_rows: 50000

wrds:
  statement_timeout: "180s"
  connection_policy: "one connection for schema and smoke checks; shard later pulls by natural date units"

private_paths:
  raw_data: "data/raw"
  interim_data: "data/interim"
  manifests: "runs"
