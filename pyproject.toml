[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segment-macro-betas"
version = "0.1.0"
description = "Point-in-time segment-implied macro exposure research pipeline."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pyarrow",
  "PyYAML",
  "wrds",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
model = [
  "lightgbm",
  "scikit-learn",
  "torch",
]
