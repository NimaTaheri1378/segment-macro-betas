<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title desc">
  <title id="title">Public and private release boundary</title>
  <desc id="desc">Public release contains code and documentation while private licensed data and outputs remain excluded.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #172033; font: 700 28px Arial, sans-serif; }
      .sub { fill: #5a667a; font: 400 14px Arial, sans-serif; }
      .panel { rx: 16; filter: url(#shadow); }
      .head { fill: #172033; font: 700 20px Arial, sans-serif; }
      .item { fill: #27364d; font: 400 15px Arial, sans-serif; }
      .badge { fill: #ffffff; stroke-width: 1.5; rx: 12; }
      .badgeText { font: 700 12px Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="430"/>
  <text x="50" y="50" class="title">Public-Safe Release Boundary</text>
  <text x="50" y="78" class="sub">The repository is designed for recruiter review and reproducibility without redistributing licensed WRDS data or private run artifacts.</text>

  <rect x="70" y="120" width="480" height="240" class="panel" fill="#d8f0e9"/>
  <text x="110" y="164" class="head">Tracked in GitHub</text>
  <text x="110" y="205" class="item">Code package and research runners</text>
  <text x="110" y="238" class="item">Public configs and schema contracts</text>
  <text x="110" y="271" class="item">Tests, CI, safety scans, release audit</text>
  <text x="110" y="304" class="item">Docs, methodology, aggregate status notes</text>
  <text x="110" y="337" class="item">Public-safe SVG figures and diagrams</text>

  <rect x="630" y="120" width="480" height="240" class="panel" fill="#fde3d7"/>
  <text x="670" y="164" class="head">Excluded from GitHub</text>
  <text x="670" y="205" class="item">Raw WRDS extracts and row-level panels</text>
  <text x="670" y="238" class="item">Private Parquet caches and model artifacts</text>
  <text x="670" y="271" class="item">Run logs, manifests, tables, dashboards</text>
  <text x="670" y="304" class="item">Rendered WRDS-derived PNG/HTML outputs</text>
  <text x="670" y="337" class="item">API keys, passwords, tokens, and .env files</text>

  <rect x="435" y="376" width="310" height="34" class="badge" stroke="#2f9e73"/>
  <text x="474" y="398" class="badgeText" fill="#23785a">release audit blocks tracked private outputs</text>
</svg>
