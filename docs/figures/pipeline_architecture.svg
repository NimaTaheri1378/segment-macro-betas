  <text x="906" y="175" class="small">rank IC and decile spreads</text>

  <rect x="870" y="218" width="210" height="54" class="box" fill="#e6dcfb"/>
  <text x="901" y="242" class="label">Deep Sets Models</text>
  <text x="901" y="261" class="small">set and attention encoders</text>

  <rect x="870" y="304" width="210" height="54" class="box" fill="#f7d6bb"/>
  <text x="905" y="328" class="label">Factor Robustness</text>
  <text x="905" y="347" class="small">alpha and turnover costs</text>

  <rect x="870" y="390" width="210" height="54" class="box" fill="#cfe3ff"/>
