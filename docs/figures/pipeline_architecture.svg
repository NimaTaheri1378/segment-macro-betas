  <text x="104" y="322" class="small">monthly forward labels</text>

  <rect x="70" y="405" width="190" height="54" class="box" fill="#d9d7f7"/>
  <text x="101" y="429" class="label">Macro Catalog</text>
  <text x="101" y="448" class="small">FRED / BLS / BEA / EIA</text>

  <rect x="330" y="145" width="190" height="54" class="box" fill="#b7ddf4"/>
  <text x="356" y="169" class="label">Segment Activation</text>
  <text x="356" y="188" class="small">filing-date availability</text>

  <rect x="330" y="279" width="190" height="54" class="box" fill="#f6c8c6"/>
  <text x="364" y="303" class="label">CCM Firm Panel</text>
  <text x="364" y="322" class="small">gvkey-permno-month</text>

  <rect x="330" y="405" width="190" height="54" class="box" fill="#d5ecb4"/>
  <text x="353" y="429" class="label">Macro Availability</text>
  <text x="353" y="448" class="small">release and vintage timing</text>

  <rect x="590" y="230" width="210" height="90" class="box" fill="#fff1a8"/>
