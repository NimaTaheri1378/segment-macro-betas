<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Segment Macro Betas pipeline architecture</title>
  <desc id="desc">Public-safe schematic showing how segment disclosures, CRSP returns, and macro series feed a point-in-time modeling and validation pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#24324b"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .title { fill: #172033; font: 700 28px Arial, sans-serif; }
      .subtitle { fill: #536174; font: 400 15px Arial, sans-serif; }
      .box { rx: 12; filter: url(#softShadow); }
      .label { fill: #172033; font: 700 15px Arial, sans-serif; }
      .small { fill: #46556b; font: 400 12px Arial, sans-serif; }
      .arrow { stroke: #24324b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lane { fill: none; stroke: #d8deea; stroke-width: 1.5; stroke-dasharray: 7 7; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="520"/>
  <text x="50" y="48" class="title">Segment Macro Betas: Point-in-Time Research Pipeline</text>
  <text x="50" y="76" class="subtitle">Code, contracts, tests, and public-safe schematics are tracked. WRDS-derived panels, logs, tables, figures, and dashboards stay private.</text>

  <rect x="34" y="104" width="1112" height="112" class="lane"/>
  <rect x="34" y="238" width="1112" height="112" class="lane"/>
  <rect x="34" y="372" width="1112" height="92" class="lane"/>
  <text x="50" y="124" class="small">Inputs</text>
  <text x="50" y="258" class="small">Point-in-time construction</text>
  <text x="50" y="392" class="small">Models, validation, and release controls</text>

  <rect x="70" y="145" width="190" height="54" class="box" fill="#c9e9e4"/>
  <text x="92" y="169" class="label">Compustat Segments</text>
  <text x="92" y="188" class="small">geographic revenue tokens</text>

  <rect x="70" y="279" width="190" height="54" class="box" fill="#fde6bd"/>
